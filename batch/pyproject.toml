[project]
name = "batch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toshiki Fukazawa", email = "zawaf0527@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "db-dtypes>=1.9.0",
    "geopandas>=1.2.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-bigquery-storage>=2.43.0",
    "google-cloud-storage>=3.17.1",
    "osmium>=4.3.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
batch = "batch:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "ipykernel>=7.4.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
